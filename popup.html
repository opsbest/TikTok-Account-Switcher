<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>TikTok Accounts</h1>

  <div class="save">
    <button id="saveBtn">Save current account</button>
  </div>

  <ul id="list"></ul>
  <p id="empty" class="muted" hidden>Nothing saved yet. Log in to TikTok and press "Save current account".</p>

  <button id="addBtn" class="secondary">+ Add new account (logs out)</button>
  <p id="status" class="muted"></p>

  <script src="popup.js"></script>
</body>
</html>
